<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online de Moda</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="contenedor">

    <h1>Tienda Online de Moda</h1>

   
    <section class="saludo-section">
        <input type="text" id="nombreInput" placeholder="Ingresá tu nombre">
        <button id="saludarBtn">Ingresar</button>
        <p id="saludo"></p>
        <p id="mensaje"></p>
    </section>


    <h2>Productos disponibles</h2>
    <div id="productos"></div>

   
    <h2>Carrito</h2>
    <ul id="carrito"></ul>

    <p id="total"></p>

    <div class="acciones-carrito">
        <button id="vaciarCarritoBtn">Vaciar carrito</button>
        <button id="comprarBtn">Finalizar compra</button>
    </div>

</main>

<!-- librería -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/main.js"></script>

</body>
</html>
